<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pureWhiteGlow {
        0%, 100% { filter: drop-shadow(0px 8px 20px rgba(255,255,255,0.25)) drop-shadow(0px 4px 10px rgba(0,0,0,0.9)); }
        50% { filter: drop-shadow(0px 14px 32px rgba(255,255,255,0.5)) drop-shadow(0px 6px 14px rgba(0,0,0,0.95)); }
      }
      @keyframes edgeFlash { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.85; } }
      .resend-mark { transform-origin: 256px 230px; animation: pureWhiteGlow 4s ease-in-out infinite; transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); cursor: pointer; }
      .resend-mark:hover { transform: scale(1.04) translateY(-4px); }
      .white-glint { animation: edgeFlash 3s ease-in-out infinite; }
      .stem-main, .stem-fold { transition: opacity 0.2s ease; }
      .resend-mark:hover .stem-main { opacity: 1; }
      .resend-mark:hover .stem-fold { opacity: 0.95; }
    </style>
    <linearGradient id="starkWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="foldWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="foldCutShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-8" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="36" fill="#000000"/>
  <g class="resend-mark">
    <path class="stem-main" d="M 160 120 L 228 328 C 238 358 258 372 280 372 C 298 372 312 360 322 344 L 282 320 C 275 330 268 334 260 334 C 248 334 240 324 234 306 L 195 120 Z" fill="url(#starkWhiteGrad)"/>
    <path class="stem-fold" d="M 322 344 L 388 138 C 394 120 388 102 372 98 C 358 94 342 104 334 122 L 280 230 L 316 248 L 354 160 C 358 150 364 146 370 148 C 375 150 376 156 374 164 L 316 338 Z" fill="url(#foldWhiteGrad)" filter="url(#foldCutShadow)"/>
    <path class="white-glint" d="M 160 120 L 195 120 L 234 306 C 240 324 248 334 260 334 C 268 334 275 330 282 320 L 322 344 C 312 360 298 372 280 372 C 258 372 238 358 228 328 Z" fill="url(#specularGlint)" opacity="0.4"/>
    <g transform="translate(0, 422)">
      <text x="256" y="0" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" letter-spacing="9">VECTA<tspan fill="#A1A1AA" font-weight="800"> AI</tspan></text>
    </g>
  </g>
</svg>
